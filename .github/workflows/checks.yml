name: checks

# The repo already had four checkers documented as deploy gates, and nothing
# ran them. This runs them on every push and PR. No install step: the checkers
# are dependency-free Node scripts.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SEO, structured data, links
        run: node scripts/check-seo.js

      - name: Header/footer parity
        run: node scripts/check-chrome.js

      - name: Blog posts
        run: node scripts/check-posts.js

      - name: Chatbot search accuracy
        run: node scripts/assistant-widget.test.js

      - name: blog and careers pages are in sync with content/
        # Same freshness contract as the kb docs below: content/ is the source,
        # and everything build-content.js writes is a committed artifact. If
        # someone edits content/ and forgets to regenerate, the site would go
        # on serving the old cards with nothing to say so.
        run: |
          node scripts/build-content.js
          git diff --exit-code -- blog.html careers.html sitemap.xml llms.txt 'blog-*.html'

      - name: docs/kb.json and docs/kb-review.md are in sync with assets/kb-data.js
        # build-kb-docs.js regenerates these. If someone edits assets/kb-data.js and
        # forgets to regenerate, the committed copies silently go stale - so
        # regenerate here and fail if anything changed.
        run: |
          node scripts/build-kb-docs.js
          # '--' so a DELETED generated file is reported as a diff rather than
          # making git treat the name as a revision and error out.
          git diff --exit-code -- docs/kb.json docs/kb-review.md
